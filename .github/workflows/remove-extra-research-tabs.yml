name: Remove Extra Research Tabs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-extra-research-tabs.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: remove-extra-research-tabs
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore clean owner-search popup
        run: |
          git show f2f4270677f4a40679545a205f0c91b9da42730e:docs/index.html > docs/index.html
      - name: Validate UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('docs/index.html').read_text()
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          if not m:
              raise SystemExit('No inline script found')
          Path('/tmp/app.js').write_text(m.group(1))
          PY
          node --check /tmp/app.js
          grep -q 'Find Owner Online' docs/index.html
          grep -q 'Open MyPlace' docs/index.html
          if grep -q 'Cuyahoga Court Docket' docs/index.html; then exit 1; fi
          if grep -q 'Cuyahoga Public Search' docs/index.html; then exit 1; fi
          if grep -q '🏗️ Building & Housing' docs/index.html; then exit 1; fi
      - name: Commit cleanup
        run: |
          git config user.name "cuyahoga-deal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Remove unreliable research tabs"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
