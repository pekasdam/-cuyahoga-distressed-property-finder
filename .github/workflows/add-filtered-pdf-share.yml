name: Deploy Filtered PDF Feature

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-filtered-pdf-share.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate filtered PDF feature
        run: |
          node --check docs/pdf-share.js
          grep -q 'function shareFilteredPdf' docs/pdf-share.js
          grep -q 'Share Filtered PDF' docs/pdf-share.js
          grep -q 'Filtered Scan Results' docs/pdf-share.js
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
