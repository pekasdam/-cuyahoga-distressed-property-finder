name: Add Filtered PDF Sharing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-filtered-pdf-share.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch filtered PDF sharing
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('docs/pdf-share.js')
          s=p.read_text()
          if 'function shareFilteredPdf()' not in s:
              s=s.replace('function buildScanPdf(data){','function buildScanPdf(data,options={}){',1)
              s=s.replace("wrapped('Complete Scan Results',14,true);wrapped(`Generated ${new Date().toLocaleString()}`,9,false);y+=4;", "wrapped(options.title||'Complete Scan Results',14,true);wrapped(`Generated ${new Date().toLocaleString()}`,9,false);if(options.filterSummary)wrapped('Filters: '+options.filterSummary,9,true);y+=4;",1)
              s=s.replace("return {doc,filename:`Cuyahoga-Scan-Results-${stamp}.pdf`,count:leads.length};", "return {doc,filename:`${options.filenamePrefix||'Cuyahoga-Scan-Results'}-${stamp}.pdf`,count:leads.length};",1)
              appendix=base64.b64decode('').decode()
              s += '\n'+appendix
          p.write_text(s)
          PY
      - name: Validate PDF code
        run: |
          node --check docs/pdf-share.js
          grep -q 'function shareFilteredPdf' docs/pdf-share.js
          grep -q 'Filtered Scan Results' docs/pdf-share.js
          grep -q 'Share Filtered PDF' docs/pdf-share.js
          grep -q 'function buildScanPdf(data,options={})' docs/pdf-share.js
      - name: Commit feature
        run: |
          git config user.name "cuyahoga-deal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/pdf-share.js
          git commit -m "Add filtered list PDF sharing"
          git push
