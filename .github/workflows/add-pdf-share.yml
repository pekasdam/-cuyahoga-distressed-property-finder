name: Add PDF Share

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-pdf-share.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: add-pdf-share
  cancel-in-progress: true

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Wire PDF sharing into app
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/index.html')
          s=p.read_text()
          marker="<script>\nconst GH_OWNER='pekasdam'"
          scripts='<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>\n<script src="pdf-share.js"></script>\n'
          if 'src="pdf-share.js"' not in s:
              if marker not in s:
                  raise SystemExit('inline script anchor not found')
              s=s.replace(marker,scripts+marker,1)
          old="window.currentOwnerSearch=owner;$('detailBody').innerHTML=`"
          new="window.currentOwnerSearch=owner;window.currentPdfLead=l;$('detailBody').innerHTML=`"
          if old in s:
              s=s.replace(old,new,1)
          elif 'window.currentPdfLead=l' not in s:
              raise SystemExit('current lead anchor not found')
          old2='<button type="button" onclick="toggleOwnerSearch()">🔎 Find Owner Online</button>${addr?`<a target="_blank" rel="noopener" href="https://www.google.com/maps/place/${mapsQ}">🗺️ Google Maps</a>'
          new2='<button type="button" onclick="toggleOwnerSearch()">🔎 Find Owner Online</button><button type="button" onclick="shareLeadPdf()">📄 Share PDF</button>${addr?`<a target="_blank" rel="noopener" href="https://www.google.com/maps/place/${mapsQ}">🗺️ Google Maps</a>'
          if '📄 Share PDF' not in s:
              if old2 not in s:
                  raise SystemExit('actions anchor not found')
              s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Validate app
        run: |
          node --check docs/pdf-share.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('docs/index.html').read_text()
          matches=re.findall(r'<script>([\s\S]*?)</script>',s)
          app=next((x for x in matches if "const GH_OWNER='pekasdam'" in x),None)
          if not app:
              raise SystemExit('No app inline script found')
          Path('/tmp/app.js').write_text(app)
          PY
          node --check /tmp/app.js
          grep -q 'jspdf/2.5.1/jspdf.umd.min.js' docs/index.html
          grep -q 'src="pdf-share.js"' docs/index.html
          grep -q '📄 Share PDF' docs/index.html
          grep -q 'window.currentPdfLead=l' docs/index.html
          grep -q 'Find Owner Online' docs/index.html
          grep -q 'google.com/maps/place/' docs/index.html
      - name: Commit PDF share feature
        run: |
          git config user.name "cuyahoga-deal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html docs/pdf-share.js
          git commit -m "Add PDF report sharing"
          git pull --rebase origin main
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy Pages
        uses: actions/deploy-pages@v4
