name: Add PDF Share

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-pdf-share.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: add-pdf-share
  cancel-in-progress: true

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Add PDF sharing
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('docs/index.html')
          s=p.read_text()
          marker="<script>\nconst GH_OWNER='pekasdam'"
          pdf_script='<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>\n'
          if pdf_script not in s:
              if marker not in s:
                  raise SystemExit('inline script anchor not found')
              s=s.replace(marker,pdf_script+marker,1)
          anchor="function typeName(x){return x==='foreclosure'?'Foreclosure':'Tired landlord'}\n"
          addition=base64.b64decode("ZnVuY3Rpb24gcGRmQ2xlYW4odj0nJyl7cmV0dXJuIFN0cmluZyh2Pz8nJykucmVwbGFjZSgvW+KAk+KAlF0vZywnLScpLnJlcGxhY2UoL1vigJh84oCZXS9nLCJcJyIpLnJlcGxhY2UoL1vigJzigJ1dL2csJyInKS5yZXBsYWNlKC9bXlx4MjAtXHg3RV0vZywnICcpLnJlcGxhY2UoL1xzKy9nLCcgJykudHJpbSgpfQpmdW5jdGlvbiBwZGZNb25leSh2KXtyZXR1cm4gdj09bnVsbHx8dj09PScnPyc  cC5wYXJjZWxfcGlufHwnVW5rbm93bicpOwogIGZpZWxkKCdMZWFkIHR5cGUnLHR5cGVOYW1lKGwubGVhZF90eXBlKSk7CiAgZmllbGQoJ0RlYWwgc2NvcmUnLFN0cmluZyhsLnNjb3JlfHwwKSsnLzEwMCcpOwogIGZpZWxkKCdMZWFkIHN0YXR1cycsbC5zdGF0dXN8fCctJyk7CiAgZmllbGQoJ1NjYW4gc3RhdHVzJyx sLnNjYW5fc3RhdHVzPT09J25ldy c/J05FVy  ").decode()
          if 'function shareLeadPdf()' not in s:
              if anchor not in s:
                  raise SystemExit('typeName anchor not found')
              s=s.replace(anchor,anchor+addition,1)
          old="window.currentOwnerSearch=owner;$('detailBody').innerHTML=`"
          new="window.currentOwnerSearch=owner;window.currentPdfLead=l;$('detailBody').innerHTML=`"
          if old in s:
              s=s.replace(old,new,1)
          elif 'window.currentPdfLead=l' not in s:
              raise SystemExit('current lead anchor not found')
          old2='<button type="button" onclick="toggleOwnerSearch()">🔎 Find Owner Online</button>${addr?`<a target="_blank" rel="noopener" href="https://www.google.com/maps/place/${mapsQ}">🗺️ Google Maps</a>'
          new2='<button type="button" onclick="toggleOwnerSearch()">🔎 Find Owner Online</button><button type="button" onclick="shareLeadPdf()">📄 Share PDF</button>${addr?`<a target="_blank" rel="noopener" href="https://www.google.com/maps/place/${mapsQ}">🗺️ Google Maps</a>'
          if '📄 Share PDF' not in s:
              if old2 not in s:
                  raise SystemExit('actions anchor not found')
              s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Validate app
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('docs/index.html').read_text()
          matches=re.findall(r'<script>([\s\S]*?)</script>',s)
          app=next((x for x in matches if "const GH_OWNER='pekasdam'" in x),None)
          if not app:
              raise SystemExit('No app inline script found')
          Path('/tmp/app.js').write_text(app)
          PY
          node --check /tmp/app.js
          grep -q 'jspdf/2.5.1/jspdf.umd.min.js' docs/index.html
          grep -q 'function shareLeadPdf' docs/index.html
          grep -q '📄 Share PDF' docs/index.html
          grep -q 'window.currentPdfLead=l' docs/index.html
          grep -q 'Find Owner Online' docs/index.html
          grep -q 'google.com/maps/place/' docs/index.html
      - name: Commit PDF share feature
        run: |
          git config user.name "cuyahoga-deal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Add PDF report sharing"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy Pages
        uses: actions/deploy-pages@v4
