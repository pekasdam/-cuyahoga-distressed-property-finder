name: Add Google Maps Property Shortcut

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-google-maps.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: add-google-maps
  cancel-in-progress: true

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add Google Maps button
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/index.html')
          s=p.read_text()
          old="bizQ=encodeURIComponent(`${owner} Ohio business`);window.currentOwnerSearch=owner;"
          new="bizQ=encodeURIComponent(`${owner} Ohio business`),mapsQ=encodeURIComponent(addr);window.currentOwnerSearch=owner;"
          if old not in s:
              raise SystemExit('query anchor not found')
          s=s.replace(old,new,1)
          old2='<button type="button" onclick="toggleOwnerSearch()">🔎 Find Owner Online</button></div>'
          new2='<button type="button" onclick="toggleOwnerSearch()">🔎 Find Owner Online</button>${addr?`<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${mapsQ}">🗺️ Google Maps</a>`:\'\'}</div>'
          if old2 not in s:
              raise SystemExit('button anchor not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Validate app
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('docs/index.html').read_text()
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          if not m:
              raise SystemExit('No inline script found')
          Path('/tmp/app.js').write_text(m.group(1))
          PY
          node --check /tmp/app.js
          grep -q 'google.com/maps/search/?api=1' docs/index.html
          grep -q 'Find Owner Online' docs/index.html
      - name: Commit map shortcut
        run: |
          git config user.name "cuyahoga-deal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Add Google Maps button to property details"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
