name: Fix Home Screen Auth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-home-screen-auth.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: home-screen-auth-fix
  cancel-in-progress: true

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch token persistence for iPhone Home Screen
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text()
          old = "const TOKEN_KEY='cuyahoga_scan_github_token_v1';\nlet payload={leads:[],stats:{}},scanPoll=null,scanStartedAt=0,previousGenerated='';"
          new = "\n".join([
              "const TOKEN_KEY='cuyahoga_scan_github_token_v1';",
              "const COOKIE_KEY='cuyahoga_scan_github_token_cookie_v1';",
              "function readCookie(name){const prefix=name+'=';const item=document.cookie.split('; ').find(x=>x.startsWith(prefix));return item?decodeURIComponent(item.slice(prefix.length)):''}",
              "function writeTokenCookie(token){document.cookie=`${COOKIE_KEY}=${encodeURIComponent(token)}; Max-Age=31536000; Path=/; Secure; SameSite=Strict`}",
              "function getAuthToken(){const local=localStorage.getItem(TOKEN_KEY)||'';const cookie=readCookie(COOKIE_KEY)||'';if(local&&!cookie)writeTokenCookie(local);if(cookie&&!local)localStorage.setItem(TOKEN_KEY,cookie);return local||cookie||''}",
              "function saveAuthToken(token){localStorage.setItem(TOKEN_KEY,token);writeTokenCookie(token)}",
              "function clearAuthToken(){localStorage.removeItem(TOKEN_KEY);document.cookie=`${COOKIE_KEY}=; Max-Age=0; Path=/; Secure; SameSite=Strict`}",
              "let payload={leads:[],stats:{}},scanPoll=null,scanStartedAt=0,previousGenerated='';",
          ])
          if old not in s:
              raise SystemExit('TOKEN_KEY anchor not found')
          s = s.replace(old, new, 1)
          replacements = [
              ("function openGitHubSetup(){const saved=localStorage.getItem(TOKEN_KEY);$('ghToken').value=saved||'';$('auth').showModal()}", "function openGitHubSetup(){const saved=getAuthToken();$('ghToken').value=saved||'';$('auth').showModal()}"),
              ("function forgetToken(){localStorage.removeItem(TOKEN_KEY);$('ghToken').value='';alert('Saved GitHub access removed from this device.')}", "function forgetToken(){clearAuthToken();$('ghToken').value='';alert('Saved GitHub access removed from this device.')}"),
              ("localStorage.setItem(TOKEN_KEY,t);$('auth').close();startScan()", "saveAuthToken(t);$('auth').close();startScan()"),
              ("const token=localStorage.getItem(TOKEN_KEY);const headers=", "const token=getAuthToken();const headers="),
              ("async function startScan(){const token=localStorage.getItem(TOKEN_KEY);if(!token)", "async function startScan(){const token=getAuthToken();if(!token)"),
              ("localStorage.removeItem(TOKEN_KEY);scanMessage('GitHub authorization needs to be connected again.'", "clearAuthToken();scanMessage('GitHub authorization needs to be connected again.'"),
              ("['q','type','score','special'].forEach(id=>$(id).addEventListener('input',render));load();", "['q','type','score','special'].forEach(id=>$(id).addEventListener('input',render));getAuthToken();load();"),
              ("The token is stored only in this app's browser storage on this device; it is not written into the public GitHub repository.", "The token stays on this device and is also saved as a first-party cookie so iPhone can carry it into a newly installed Home Screen app; it is not written into the public GitHub repository."),
          ]
          for a, b in replacements:
              if a not in s:
                  raise SystemExit('anchor not found: ' + a[:70])
              s = s.replace(a, b, 1)
          p.write_text(s)
          PY
      - name: Verify patch
        run: |
          grep -q "COOKIE_KEY='cuyahoga_scan_github_token_cookie_v1'" docs/index.html
          grep -q "function getAuthToken" docs/index.html
          grep -q "function clearAuthToken" docs/index.html
      - name: Commit fix
        run: |
          git config user.name "cuyahoga-deal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Persist scan auth for iPhone Home Screen"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
