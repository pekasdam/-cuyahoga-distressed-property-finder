name: Bootstrap Full Project

on:
  push:
    paths:
      - 'bootstrap/part_*.b64'

permissions:
  contents: write

concurrency:
  group: bootstrap-distressed-property-finder
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild project package
        run: |
          cat bootstrap/part_*.b64 | base64 -d > /tmp/project.zip
          unzip -o /tmp/project.zip -d .
      - name: Commit full project
        run: |
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name "cuyahoga-deal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Install full distressed property finder" || exit 0
          git push
