name: Add Preliminary Title Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-title-check.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: add-title-check
  cancel-in-progress: true

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add title check panel
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/index.html')
          s=p.read_text()

          anchor="function typeName(x){return x==='foreclosure'?'Foreclosure':'Tired landlord'}\n"
          addition="""function titleName(v=''){return String(v||'').toUpperCase().replace(/\\b(ET AL|TRUSTEE|UNKNOWN|TENANT|SPOUSE)\\b/g,' ').replace(/[^A-Z0-9]/g,' ').replace(/\\s+/g,' ').trim()}\nfunction titlePrecheck(l){const p=l.parcel||{},deeded=(p.owner||'').trim(),caseOwner=(l.owner_or_defendant||'').trim(),pin=(p.parcel_pin||'').trim(),issues=[],facts=[];if(!pin)issues.push('No parcel match — ownership chain cannot be checked from this lead.');if(l.tax_foreclosure)issues.push('Tax foreclosure filing is present.');else if(l.lead_type==='foreclosure')issues.push('Foreclosure filing is present.');if(deeded&&caseOwner&&titleName(deeded)&&titleName(caseOwner)&&!titleName(deeded).includes(titleName(caseOwner))&&!titleName(caseOwner).includes(titleName(deeded)))issues.push('Court/lead name differs from current deeded owner — verify chain of title.');if(!p.transfer_date)issues.push('Last transfer date is unavailable in the parcel feed.');if(p.last_sale_amount===0)facts.push('Last recorded sale amount is $0; this can reflect a non-arm’s-length transfer and needs deed review.');const priority=!pin||l.tax_foreclosure?'HIGH REVIEW':l.lead_type==='foreclosure'||issues.length>=2?'REVIEW':'STANDARD REVIEW';return {priority,issues,facts,deeded,caseOwner,pin}}\nfunction toggleTitleCheck(){const p=$('titleCheckPanel');if(p)p.classList.toggle('show')}\nasync function openTitleSource(kind){const l=window.currentTitleLead;if(!l)return;const p=l.parcel||{},pin=(p.parcel_pin||'').trim(),owner=(p.owner||l.owner_or_defendant||'').trim(),caseNo=(l.case_number||'').trim();let copy='',url='';if(kind==='recorder'){copy=pin;url='https://cuyahoga.oh.publicsearch.us/search/advanced'}else if(kind==='court'){copy=caseNo||owner;url='https://cpdocket.cp.cuyahogacounty.gov/Search.aspx'}else if(kind==='sheriff'){copy=pin;url='https://cpdocket.cp.cuyahogacounty.gov/sheriffsearch/search.aspx'}if(copy){try{await navigator.clipboard.writeText(copy)}catch{}}window.open(url,'_blank','noopener')}\n"""
          if anchor not in s: raise SystemExit('typeName anchor not found')
          s=s.replace(anchor,anchor+addition,1)

          old="""zillowQ=encodeURIComponent(`site:zillow.com/homedetails/ \"${addr}\"`),redfinQ=encodeURIComponent(`site:redfin.com \"${addr}\"`),realtorQ=encodeURIComponent(`site:realtor.com \"${addr}\"`);window.currentOwnerSearch=owner;$('detailBody').innerHTML=`"""
          new="""zillowQ=encodeURIComponent(`site:zillow.com/homedetails/ \"${addr}\"`),redfinQ=encodeURIComponent(`site:redfin.com \"${addr}\"`),realtorQ=encodeURIComponent(`site:realtor.com \"${addr}\"`),tc=titlePrecheck(l),titleIssues=tc.issues.length?tc.issues.map(x=>`<li>${esc(x)}</li>`).join(''):'<li>No additional red flags found in the data currently collected by this app.</li>',titleFacts=tc.facts.map(x=>`<li>${esc(x)}</li>`).join('');window.currentOwnerSearch=owner;window.currentTitleLead=l;$('detailBody').innerHTML=`"""
          if old not in s: raise SystemExit('openLead query anchor not found')
          s=s.replace(old,new,1)

          old2='<button type="button" onclick="toggleOwnerSearch()">🔎 Find Owner Online</button>${addr?`<a target="_blank" rel="noopener" href="https://www.google.com/maps/place/${mapsQ}">🗺️ Google Maps</a>'
          new2='<button type="button" onclick="toggleOwnerSearch()">🔎 Find Owner Online</button><button type="button" onclick="toggleTitleCheck()">📑 Title Check</button>${addr?`<a target="_blank" rel="noopener" href="https://www.google.com/maps/place/${mapsQ}">🗺️ Google Maps</a>'
          if old2 not in s: raise SystemExit('action anchor not found')
          s=s.replace(old2,new2,1)

          old3='</div><div id="ownerSearchPanel" class="ownersearch"><h3>Find Owner Online</h3>'
          title_panel='''</div><div id="titleCheckPanel" class="ownersearch"><h3>📑 Preliminary Title Check</h3><div class="detailgrid"><div><span>Review priority</span><b>${esc(tc.priority)}</b></div><div><span>Current deeded owner</span><b>${esc(tc.deeded||\'Unknown\')}</b></div><div><span>Parcel</span><b>${esc(tc.pin||\'No parcel match\')}</b></div><div><span>Last transfer</span><b>${esc(p.transfer_date||\'Not available\')}</b></div><div><span>Last recorded sale</span><b>${money(p.last_sale_amount)}</b></div><div><span>Foreclosure signal</span><b>${l.tax_foreclosure?\'Tax foreclosure\':l.lead_type===\'foreclosure\'?\'Foreclosure filing\':\'None in this lead\'}</b></div></div><h3>Automatic checks</h3><ul>${titleIssues}${titleFacts}</ul><div class="ownerhint"><b>Still needs official document review:</b> mortgages, mortgage releases, assignments, judgment/liens, mechanic’s liens, federal/state liens, probate/divorce interests, deed restrictions and other recorded encumbrances. This is a preliminary research aid, not a title commitment or title insurance.</div><div class="ownergrid" style="margin-top:10px"><button type="button" onclick="openTitleSource(\'recorder\')">Recorded Documents<br><small>Parcel copied</small></button><button type="button" onclick="openTitleSource(\'court\')">Court Docket<br><small>Case/owner copied</small></button><button type="button" onclick="openTitleSource(\'sheriff\')">Sheriff Foreclosure<br><small>Parcel copied</small></button>${p.myplace_url?`<a target="_blank" rel="noopener" href="${esc(p.myplace_url)}">Verify Owner / Transfer</a>`:\'\'}</div></div><div id="ownerSearchPanel" class="ownersearch"><h3>Find Owner Online</h3>'''
          if old3 not in s: raise SystemExit('owner panel anchor not found')
          s=s.replace(old3,title_panel,1)
          p.write_text(s)
          PY
      - name: Validate app
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('docs/index.html').read_text()
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          if not m: raise SystemExit('No inline script found')
          Path('/tmp/app.js').write_text(m.group(1))
          PY
          node --check /tmp/app.js
          grep -q '📑 Title Check' docs/index.html
          grep -q 'Preliminary Title Check' docs/index.html
          grep -q 'titlePrecheck' docs/index.html
          grep -q 'cuyahoga.oh.publicsearch.us/search/advanced' docs/index.html
          grep -q 'sheriffsearch/search.aspx' docs/index.html
          grep -q 'Find Owner Online' docs/index.html
          grep -q 'google.com/maps/place/' docs/index.html
      - name: Commit title check
        run: |
          git config user.name "cuyahoga-deal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Add preliminary title check to property details"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
