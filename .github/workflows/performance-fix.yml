name: Apply Clerk Document Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/performance-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Patch Clerk document postback precisely
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scraper.py')
          s = p.read_text()

          replacements = [
              ('        document_url = urljoin(base_url, link["href"]) if link else ""',
               '        href = clean_text(link.get("href")) if link else ""\n'
               '        event_target = ""\n'
               '        event_argument = ""\n'
               '        if href.lower().startswith("javascript:__dopostback"):\n'
               '            match = re.search(r"__doPostBack\\(\\\'([^\\\']*)\\\',\\\'([^\\\']*)\\\'\\)", href, re.I)\n'
               '            if match:\n'
               '                event_target, event_argument = match.groups()\n'
               '        document_url = base_url if event_target else (urljoin(base_url, href) if href else "")'),
              ('                "document_url": document_url,\n',
               '                "document_url": document_url,\n'
               '                "document_event_target": event_target,\n'
               '                "document_event_argument": event_argument,\n'),
              ('        url = row.get("document_url")\n        if not url:',
               '        url = row.get("document_url")\n'
               '        event_target = clean_text(row.get("document_event_target"))\n'
               '        if not url and not event_target:'),
              ('            doc = request(session, url, timeout=45)\n            pins, addresses = extract_document_signals(doc.content)',
               '            if event_target:\n'
               '                bundle = download_foreclosure_bundle(\n'
               '                    session, resp.text, event_target, clean_text(row.get("document_event_argument"))\n'
               '                )\n'
               '            else:\n'
               '                bundle = request(session, url, timeout=30).content\n'
               '            pins, addresses = extract_document_signals(bundle)'),
              ('            row["address_candidates"] = addresses\n        except Exception as exc:',
               '            row["address_candidates"] = addresses\n'
               '            row["document_inspected"] = True\n'
               '        except Exception as exc:'),
              ('            row["address_candidates"] = []\n    return rows',
               '            row["address_candidates"] = []\n'
               '            row["document_inspected"] = False\n'
               '    return rows'),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match, got {count}: {old[:80]}')
              s = s.replace(old, new, 1)

          anchor = '\n\ndef scrape_foreclosures(\n'
          helper = '''

          def download_foreclosure_bundle(
              session: requests.Session,
              page_html: str,
              event_target: str,
              event_argument: str = "",
          ) -> bytes:
              """Submit the ASP.NET postback behind the Clerk's Documents link."""
              soup = BeautifulSoup(page_html, "lxml")
              form = soup.find("form")
              if form is None:
                  raise RuntimeError("Clerk foreclosure form not found")
              data: dict[str, str] = {}
              for field in form.find_all("input"):
                  name = field.get("name")
                  if name and clean_text(field.get("type")).lower() == "hidden":
                      data[name] = field.get("value", "")
              data["__EVENTTARGET"] = event_target
              data["__EVENTARGUMENT"] = event_argument
              response = session.post(
                  FORECLOSURE_URL,
                  data=data,
                  timeout=30,
                  headers={"Referer": FORECLOSURE_URL},
              )
              response.raise_for_status()
              if not zipfile.is_zipfile(io.BytesIO(response.content)):
                  ctype = response.headers.get("Content-Type", "unknown")
                  raise RuntimeError(f"Clerk postback returned {ctype}, not a ZIP")
              return response.content
          '''.replace('\n          ', '\n')
          if s.count(anchor) != 1:
              raise SystemExit(f'anchor count={s.count(anchor)}')
          s = s.replace(anchor, helper + anchor, 1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt pytest
      - name: Validate code
        run: |
          python -m pytest -q
          python -m py_compile scraper.py app.py
      - name: Test one live Clerk document
        run: |
          python - <<'PY'
          from scraper import make_session, scrape_foreclosures
          rows = scrape_foreclosures(make_session(), inspect_documents=True, max_documents=1, max_records=2)
          print('rows=', len(rows))
          print('inspected=', rows[0].get('document_inspected'))
          print('pins=', rows[0].get('parcel_candidates'))
          print('addresses=', rows[0].get('address_candidates'))
          assert rows and rows[0].get('document_inspected') is True
          PY
      - name: Commit Clerk fix
        run: |
          git config user.name "cuyahoga-deal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scraper.py
          git commit -m "Support Clerk foreclosure document downloads" || exit 0
          git pull --rebase origin main
          git push
