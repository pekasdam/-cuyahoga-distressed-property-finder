name: Apply Housing Court Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/performance-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Patch Housing Court parser and cap owner lookups
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scraper.py')
          s = p.read_text()

          replacements = [
              ('            tds = tr.find_all("td")',
               '            cells = tr.find_all(["th", "td"])'),
              ('            if len(tds) < 5:',
               '            if len(cells) < 5:'),
              ('            vals = [clean_text(td.get_text(" ", strip=True)) for td in tds]',
               '            vals = [clean_text(cell.get_text(" ", strip=True)) for cell in cells]\n'
               '            if vals[0].lower().startswith("case"):\n'
               '                continue'),
              ('def build_eviction_leads(session: requests.Session, rows: list[dict[str, str]]) -> list[Lead]:',
               'def build_eviction_leads(session: requests.Session, rows: list[dict[str, str]], max_owners: int = 30) -> list[Lead]:'),
              ('    for owner_key, repeat_count in sorted(counts.items(), key=lambda kv: kv[1], reverse=True):',
               '    for owner_key, repeat_count in sorted(counts.items(), key=lambda kv: kv[1], reverse=True)[:max_owners]:'),
              ('    parser.add_argument("--max-foreclosures", type=int, default=int(os.getenv("MAX_FORECLOSURE_RECORDS", "30")))\n',
               '    parser.add_argument("--max-foreclosures", type=int, default=int(os.getenv("MAX_FORECLOSURE_RECORDS", "30")))\n'
               '    parser.add_argument("--max-eviction-owners", type=int, default=int(os.getenv("MAX_EVICTION_OWNERS", "30")))\n'),
              ('            ev_leads = build_eviction_leads(session, evictions)',
               '            ev_leads = build_eviction_leads(session, evictions, max_owners=max(1, args.max_eviction_owners))'),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old[:80]}')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt pytest
      - name: Validate patched code
        run: |
          python -m pytest -q
          python -m py_compile scraper.py app.py
      - name: Live-check Housing Court parser
        run: |
          python - <<'PY'
          from scraper import make_session, scrape_evictions
          rows = scrape_evictions(make_session())
          print('eviction/default rows=', len(rows))
          assert len(rows) > 0
          PY
      - name: Commit Housing Court fix
        run: |
          git config user.name "cuyahoga-deal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scraper.py
          git commit -m "Fix Housing Court eviction parsing" || exit 0
          git pull --rebase origin main
          git push
