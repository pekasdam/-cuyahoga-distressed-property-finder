name: Diagnose Housing Docket Markup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/performance-fix.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect live Housing Court markup
        run: |
          pip install -q requests beautifulsoup4 lxml
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          url='https://www.clevelandhousingcourt.org/accessible-civil-docket'
          html=requests.get(url, timeout=30, headers={'User-Agent':'Mozilla/5.0'}).text
          soup=BeautifulSoup(html,'lxml')
          print('length=', len(html), 'tables=', len(soup.find_all('table')), 'trs=', len(soup.find_all('tr')))
          node=soup.find(string=re.compile(r'Housing Eviction', re.I))
          if node:
              print('NODE=', repr(str(node)[:300]))
              parent=node.parent
              for level in range(5):
                  if not parent: break
                  print(f'PARENT{level}=', str(parent)[:4000])
                  parent=parent.parent
          else:
              idx=html.lower().find('housing eviction')
              print('raw-index=', idx)
              print(html[max(0,idx-2500):idx+2500])
          PY
