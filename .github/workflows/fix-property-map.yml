name: Fix Google Maps Property Address

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-property-map.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Lock Maps to property address
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/index.html')
          s=p.read_text()
          old="bizQ=encodeURIComponent(`${owner} Ohio business`),mapsQ=encodeURIComponent(addr),zillowQ="
          new="bizQ=encodeURIComponent(`${owner} Ohio business`),mapAddress=[addr,(p.city&&!addr.toUpperCase().includes(String(p.city).toUpperCase()))?p.city:'',(!/\\bOH\\b/i.test(addr))?'OH':'',(p.zip_code&&!addr.includes(String(p.zip_code)))?p.zip_code:''].filter(Boolean).join(', '),mapsQ=encodeURIComponent(mapAddress),zillowQ="
          if old not in s:
              raise SystemExit('map query anchor not found')
          s=s.replace(old,new,1)
          old2='href="https://www.google.com/maps/search/?api=1&query=${mapsQ}"'
          new2='href="https://www.google.com/maps/place/${mapsQ}"'
          if old2 not in s:
              raise SystemExit('map href anchor not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Validate app
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('docs/index.html').read_text()
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          if not m:
              raise SystemExit('No inline script found')
          Path('/tmp/app.js').write_text(m.group(1))
          PY
          node --check /tmp/app.js
          grep -q 'google.com/maps/place/' docs/index.html
          grep -q 'mapAddress=\[addr' docs/index.html
          if grep -q 'maps/search/?api=1' docs/index.html; then exit 1; fi
      - name: Commit fix
        run: |
          git config user.name "cuyahoga-deal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Open Google Maps at exact property address"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
