name: Scan Cuyahoga Distressed Leads

# Final production trigger after Housing Court parser fix.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scraper.py'
      - '.github/workflows/scan.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: distressed-lead-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Validate scraper
        run: python -m pytest -q
      - name: Run scraper
        env:
          MAX_FORECLOSURE_DOCUMENTS: '8'
          MAX_FORECLOSURE_RECORDS: '30'
          MAX_EVICTION_OWNERS: '30'
        run: python scraper.py --output data/leads.json
      - name: Update mobile dashboard data
        run: |
          mkdir -p docs/data
          cp data/leads.json docs/data/leads.json
      - name: Commit updated leads
        run: |
          if git diff --quiet -- data/leads.json docs/data/leads.json; then
            echo "No lead changes"
            exit 0
          fi
          git config user.name "cuyahoga-deal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/leads.json docs/data/leads.json
          git commit -m "Update distressed property leads"
          git pull --rebase origin main
          git push
