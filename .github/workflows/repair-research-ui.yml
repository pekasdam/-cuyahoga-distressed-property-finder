name: Repair Research UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-research-ui.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: repair-research-ui
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last known-good research UI
        run: |
          git show ec75e2cf98ee036089c99af05fdc7f54ae5ef439:docs/index.html > docs/index.html
      - name: Validate inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('docs/index.html').read_text()
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          if not m:
              raise SystemExit('No inline script found')
          Path('/tmp/app.js').write_text(m.group(1))
          PY
          node --check /tmp/app.js
          grep -q 'Find Owner Online' docs/index.html
          grep -q 'Cuyahoga Court Docket' docs/index.html
          grep -q 'Cuyahoga Public Search' docs/index.html
          grep -q 'Building & Housing' docs/index.html
      - name: Commit repaired UI
        run: |
          git config user.name "cuyahoga-deal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Restore working owner and research buttons"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
