name: Deploy Mobile Dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest lead data
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply underwriting and full auction import
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/multifamily-checker/index.html')
          s = p.read_text()
          s = s.replace('$65,000', '$45,000').replace('65000', '45000')
          for old in (
              '<script src="./auto-underwrite.js?v=2"></script>',
              '<script src="./auto-underwrite.js?v=3"></script>',
              '<script src="./auto-underwrite.js?v=4"></script>',
              '<script src="./auto-underwrite.js?v=5"></script>',
              '<script src="./auction-parser.js?v=1"></script>',
              '<script src="./auction-parser.js?v=2"></script>',
              '<script src="./screenshot-ocr.js?v=1"></script>',
              '<script src="./screenshot-ocr.js?v=2"></script>',
              '<script src="./opening-bid-fix.js?v=1"></script>',
              '<script src="./full-auction-record.js?v=1"></script>',
              '<script src="./ai-underwriter.js?v=1"></script>',
              '<script src="./ai-underwriter.js?v=2"></script>'
          ):
              s = s.replace(old, '')
          tags = '\n'.join((
              '<script src="./auto-underwrite.js?v=5"></script>',
              '<script src="./auction-parser.js?v=2"></script>',
              '<script src="./opening-bid-fix.js?v=1"></script>',
              '<script src="./full-auction-record.js?v=1"></script>',
              '<script src="./screenshot-ocr.js?v=2"></script>',
              '<script src="./ai-underwriter.js?v=2"></script>'
          ))
          s = s.replace('</body>', tags + '\n</body>')
          p.write_text(s)
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload mobile dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
