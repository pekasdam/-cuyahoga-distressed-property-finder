name: Deploy Mobile Dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest lead data
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Add photo upload and property cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/multifamily-checker/index.html')
          s = p.read_text()
          for old in (
              '<script src="./photo-upload.js?v=1"></script>',
              '<script src="./condo-filter.js?v=1"></script>',
              '<script src="./property-cards.js?v=1"></script>',
              '<script src="./property-cards.js?v=2"></script>',
              '<script src="./property-cards.js?v=3"></script>'
          ):
              s = s.replace(old, '')
          tags = [
              '<script src="./photo-upload.js?v=1"></script>',
              '<script src="./property-cards.js?v=3"></script>'
          ]
          s = s.replace('</body>', '\n'.join(tags) + '\n</body>')
          p.write_text(s)
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload mobile dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
