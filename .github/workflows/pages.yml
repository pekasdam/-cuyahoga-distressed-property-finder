name: Deploy Mobile Dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest lead data
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Inject auto-underwriting engine
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/multifamily-checker/index.html')
          s = p.read_text()
          old = '<script src="./auto-underwrite.js?v=2"></script>'
          tag = '<script src="./auto-underwrite.js?v=3"></script>'
          s = s.replace(old, '')
          if tag not in s:
              s = s.replace('</body>', tag + '\n</body>')
              p.write_text(s)
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload mobile dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
