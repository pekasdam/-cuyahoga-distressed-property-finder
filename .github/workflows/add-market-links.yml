name: Add Market Property Shortcuts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-market-links.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: add-market-links
  cancel-in-progress: true

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add Zillow Redfin Realtor buttons
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/index.html')
          s=p.read_text()

          old="bizQ=encodeURIComponent(`${owner} Ohio business`),mapsQ=encodeURIComponent(addr);window.currentOwnerSearch=owner;"
          new="bizQ=encodeURIComponent(`${owner} Ohio business`),mapsQ=encodeURIComponent(addr),zillowQ=encodeURIComponent(`site:zillow.com/homedetails/ \"${addr}\"`),redfinQ=encodeURIComponent(`site:redfin.com \"${addr}\"`),realtorQ=encodeURIComponent(`site:realtor.com \"${addr}\"`);window.currentOwnerSearch=owner;"
          if old not in s:
              raise SystemExit('query anchor not found')
          s=s.replace(old,new,1)

          old2='${addr?`<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${mapsQ}">🗺️ Google Maps</a>`:\'\'}</div>'
          new2='${addr?`<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${mapsQ}">🗺️ Google Maps</a><a target="_blank" rel="noopener" href="https://www.google.com/search?q=${zillowQ}">🏠 Zillow</a><a target="_blank" rel="noopener" href="https://www.google.com/search?q=${redfinQ}">🔴 Redfin</a><a target="_blank" rel="noopener" href="https://www.google.com/search?q=${realtorQ}">🏡 Realtor.com</a>`:\'\'}</div>'
          if old2 not in s:
              raise SystemExit('maps button anchor not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Validate app
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('docs/index.html').read_text()
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          if not m:
              raise SystemExit('No inline script found')
          Path('/tmp/app.js').write_text(m.group(1))
          PY
          node --check /tmp/app.js
          grep -q '>🏠 Zillow<' docs/index.html
          grep -q '>🔴 Redfin<' docs/index.html
          grep -q '>🏡 Realtor.com<' docs/index.html
          grep -q 'Find Owner Online' docs/index.html
          grep -q 'google.com/maps/search/?api=1' docs/index.html
      - name: Commit market shortcuts
        run: |
          git config user.name "cuyahoga-deal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Add Zillow Redfin and Realtor property shortcuts"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
