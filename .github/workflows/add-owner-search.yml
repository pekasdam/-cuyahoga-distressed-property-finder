name: Add Owner Search Panel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-owner-search.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: owner-search-ui
  cancel-in-progress: true

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add owner contact search tools
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text()

          css_old = '.actions a{text-align:center;text-decoration:none;background:#111827;color:white;padding:11px;border-radius:10px;font-weight:600;font-size:13px}.empty'
          css_new = '.actions a,.actions button{text-align:center;text-decoration:none;background:#111827;color:white;padding:11px;border-radius:10px;font-weight:600;font-size:13px;border:0;cursor:pointer}.ownersearch{display:none;margin-top:12px;padding:12px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px}.ownersearch.show{display:block}.ownersearch h3{margin:0 0 8px}.ownergrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.ownergrid a,.ownergrid button{display:block;text-align:center;text-decoration:none;background:#fff;color:#111827;border:1px solid #d1d5db;padding:10px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer}.ownerhint{font-size:12px;color:#6b7280;margin-top:9px}.empty'
          if css_old not in s:
              raise SystemExit('CSS anchor not found')
          s = s.replace(css_old, css_new, 1)

          old = "function openLead(id){const l=payload.leads.find(x=>x.lead_id===id);if(!l)return;const p=l.parcel||{},notes=(l.notes||[]).map(n=>`<li>${esc(n)}</li>`).join('');$('detailBody').innerHTML=`<h2 style=\"margin-top:0\">${esc(p.property_address||l.title||'Lead')}</h2><p><b>Deal score:</b> ${l.score||0}/100<br><b>Owner:</b> ${esc(p.owner||l.owner_or_defendant||'Unknown')}<br><b>Parcel:</b> ${esc(p.parcel_pin||'Unknown')}<br><b>Land use:</b> ${esc(p.land_use||'Unknown')}<br><b>Certified tax value:</b> ${money(p.certified_tax_total)}<br><b>Filed / hearing:</b> ${esc(l.filed_or_hearing_date||'')}</p><h3>Why it scored this way</h3><ul>${notes}</ul><div class=\"actions\">${p.myplace_url?`<a target=\"_blank\" href=\"${esc(p.myplace_url)}\">Open MyPlace</a>`:''}${l.source_url?`<a target=\"_blank\" href=\"${esc(l.source_url)}\">Court source</a>`:''}</div>`;$('detail').showModal()}"
          new = "function openLead(id){const l=payload.leads.find(x=>x.lead_id===id);if(!l)return;const p=l.parcel||{},notes=(l.notes||[]).map(n=>`<li>${esc(n)}</li>`).join(''),owner=(p.owner||l.owner_or_defendant||'').trim(),addr=(p.property_address||'').trim(),personQ=encodeURIComponent(`${owner} Cleveland Ohio`),fullQ=encodeURIComponent(`${owner} ${addr} Cleveland Ohio`),bizQ=encodeURIComponent(`${owner} Ohio business`);window.currentOwnerSearch=owner;$('detailBody').innerHTML=`<h2 style=\"margin-top:0\">${esc(p.property_address||l.title||'Lead')}</h2><p><b>Deal score:</b> ${l.score||0}/100<br><b>Owner:</b> ${esc(owner||'Unknown')}<br><b>Parcel:</b> ${esc(p.parcel_pin||'Unknown')}<br><b>Land use:</b> ${esc(p.land_use||'Unknown')}<br><b>Certified tax value:</b> ${money(p.certified_tax_total)}<br><b>Filed / hearing:</b> ${esc(l.filed_or_hearing_date||'')}</p><h3>Why it scored this way</h3><ul>${notes}</ul><div class=\"actions\">${p.myplace_url?`<a target=\"_blank\" href=\"${esc(p.myplace_url)}\">Open MyPlace</a>`:''}${l.source_url?`<a target=\"_blank\" href=\"${esc(l.source_url)}\">Court source</a>`:''}<button type=\"button\" onclick=\"toggleOwnerSearch()\">🔎 Find Owner Online</button></div><div id=\"ownerSearchPanel\" class=\"ownersearch\"><h3>Find Owner Online</h3><div class=\"muted\" style=\"margin-bottom:9px\">Search for <b>${esc(owner||'Unknown owner')}</b></div><div class=\"ownergrid\"><a target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/search?q=${fullQ}\">Google owner + address</a><a target=\"_blank\" rel=\"noopener\" href=\"https://www.facebook.com/search/people/?q=${personQ}\">Facebook people</a><a target=\"_blank\" rel=\"noopener\" href=\"https://www.linkedin.com/search/results/people/?keywords=${personQ}\">LinkedIn people</a><a target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/search?q=${bizQ}\">Ohio business search</a><button type=\"button\" onclick=\"copyOwnerName()\">Copy owner name</button><a target=\"_blank\" rel=\"noopener\" href=\"https://businesssearch.ohiosos.gov/\">Ohio SOS records</a></div><div class=\"ownerhint\">Verify a profile with more than just the name before contacting anyone. For LLCs, use Ohio SOS records to identify the statutory agent or associated business record.</div></div>`;$('detail').showModal()}"
          if old not in s:
              raise SystemExit('openLead anchor not found')
          s = s.replace(old, new, 1)

          anchor = "async function load(){"
          helpers = "function toggleOwnerSearch(){const p=$('ownerSearchPanel');if(p)p.classList.toggle('show')}\nasync function copyOwnerName(){const name=window.currentOwnerSearch||'';if(!name)return;try{await navigator.clipboard.writeText(name);alert('Owner name copied.')}catch{prompt('Copy owner name:',name)}}\n"
          if anchor not in s:
              raise SystemExit('load anchor not found')
          s = s.replace(anchor, helpers + anchor, 1)

          p.write_text(s)
          PY
      - name: Verify owner search UI
        run: |
          grep -q 'Find Owner Online' docs/index.html
          grep -q 'facebook.com/search/people' docs/index.html
          grep -q 'linkedin.com/search/results/people' docs/index.html
          grep -q 'businesssearch.ohiosos.gov' docs/index.html
          grep -q 'copyOwnerName' docs/index.html
      - name: Commit owner search UI
        run: |
          git config user.name "cuyahoga-deal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Add owner social and public-record search tools"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
